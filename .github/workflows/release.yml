# Publish this package to npm, signed against the commit that built it.
#
# Triggered by a `v*` tag, so a release is one deliberate act and a version bump
# on `main` publishes nothing on its own — the same rule `release-cli` follows in
# the monorepo.
#
# WHY THIS EXISTS, beyond convenience: 0.2.0 went out from a laptop with
# `npm publish`, which leaves the `workspace:` protocol verbatim in the manifest.
# Twelve packages shipped depending on `workspace:*` and nobody could install
# them. A pipeline that always runs `pnpm publish` cannot make that mistake, and
# provenance makes the tarball traceable to the commit rather than to a machine.
name: release

on:
  push:
    tags: ["v*"]
  # Runs everything except the publish, which is the only way to find out that a
  # release is broken BEFORE a tag makes it public.
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance signs the package against this workflow run. It is what puts
  # "Built and signed on GitHub Actions" on the npm page and lets anyone verify
  # which commit produced the tarball.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # No lockfile is committed here: this package is developed inside a pnpm
      # workspace and cloned out of it, so its lockfile would describe the
      # workspace and not this checkout. CI resolves fresh instead, which is why
      # the sibling `@voxelkloud/*` ranges must be real semver and never
      # `workspace:*` — outside the workspace that protocol resolves to nothing.
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm build
      - run: pnpm test

      # A tag that disagrees with the manifest means someone tagged the wrong
      # commit, and publishing anyway puts a version on npm that matches no tag.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $PKG"
            exit 1
          fi

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
